<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>생각의 씨앗 | 개념의 숲 인트로</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #fff; }
      canvas { display: block; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <canvas id="frame" width="1920" height="1080" aria-label="개념의 숲 브랜드 인트로"></canvas>
    <script>
      (() => {
        "use strict";

        const W = 1920;
        const H = 1080;
        const CX = W / 2;
        const CY = H / 2;
        const COLORS = {
          white: "#ffffff",
          black: "#151a16",
          green: "#376b4a",
          lime: "#d9e8a9",
          orange: "#e5965c"
        };
        const canvas = document.getElementById("frame");
        const ctx = canvas.getContext("2d", { alpha: false });

        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
        const mix = (a, b, amount) => a + (b - a) * amount;
        const expoOut = (value) => {
          const t = clamp(value);
          return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
        };
        const expoInOut = (value) => {
          const t = clamp(value);
          if (t === 0 || t === 1) return t;
          return t < 0.5
            ? Math.pow(2, 20 * t - 10) / 2
            : (2 - Math.pow(2, -20 * t + 10)) / 2;
        };
        const spring = (time, duration = 0.52) => {
          const t = clamp(time / duration);
          const raw = 1 - (1 + 4 * t) * Math.exp(-4 * t);
          const end = 1 - 5 * Math.exp(-4);
          return clamp(raw / end);
        };
        const withMotion = (draw, velocityX = 0, velocityY = 0) => {
          const speed = Math.hypot(velocityX, velocityY);
          const blur = Math.min(2.4, speed / 1800);
          ctx.save();
          if (blur > 0.08) {
            ctx.filter = `blur(${blur.toFixed(2)}px)`;
            ctx.translate(-Math.sign(velocityX) * blur * 1.4, -Math.sign(velocityY) * blur * 1.4);
          }
          draw();
          ctx.restore();
        };

        function text(value, x, y, size, color = COLORS.black, weight = 800, scaleX = 1, align = "center") {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scaleX, 1);
          ctx.fillStyle = color;
          ctx.font = `${weight} ${size}px Inter, sans-serif`;
          ctx.textAlign = align;
          ctx.textBaseline = "middle";
          ctx.fillText(value, 0, 0);
          ctx.restore();
        }

        function line(x1, y1, x2, y2, color = COLORS.black, width = 4) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineWidth = width;
          ctx.lineCap = "round";
          ctx.strokeStyle = color;
          ctx.stroke();
        }

        function lineProgress(x1, y1, x2, y2, progress, color = COLORS.black, width = 4) {
          const p = clamp(progress);
          line(x1, y1, mix(x1, x2, p), mix(y1, y2, p), color, width);
        }

        function polygon(points, fill, stroke = null, width = 3) {
          if (!points.length) return;
          ctx.beginPath();
          ctx.moveTo(points[0][0], points[0][1]);
          for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = width;
            ctx.lineJoin = "round";
            ctx.stroke();
          }
        }

        function drawLeaf(x, y, size, color = COLORS.green, rotation = 0) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rotation);
          ctx.beginPath();
          ctx.moveTo(0, size * 0.56);
          ctx.bezierCurveTo(-size * 0.57, size * 0.18, -size * 0.45, -size * 0.45, 0, -size * 0.54);
          ctx.bezierCurveTo(size * 0.48, -size * 0.46, size * 0.59, size * 0.16, 0, size * 0.56);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
          ctx.strokeStyle = COLORS.black;
          ctx.lineWidth = Math.max(2, size * 0.026);
          ctx.stroke();
          line(0, size * 0.48, 0, -size * 0.39, COLORS.black, Math.max(2, size * 0.022));
          line(0, size * 0.12, -size * 0.19, -size * 0.09, COLORS.black, Math.max(1.5, size * 0.016));
          line(0, -size * 0.1, size * 0.2, -size * 0.29, COLORS.black, Math.max(1.5, size * 0.016));
          ctx.restore();
        }

        function drawMorphNode(x, y, radius, morph, color) {
          const amount = clamp(morph);
          const points = [];
          const steps = 48;
          for (let i = 0; i < steps; i += 1) {
            const angle = (i / steps) * Math.PI * 2;
            const circleRadius = radius;
            const squareRadius = radius / Math.max(Math.abs(Math.cos(angle)), Math.abs(Math.sin(angle)));
            const r = mix(circleRadius, squareRadius, amount);
            points.push([x + Math.cos(angle) * r, y + Math.sin(angle) * r]);
          }
          polygon(points, color, COLORS.black, Math.max(2, radius * 0.08));
        }

        function drawLogo(scale = 1) {
          ctx.save();
          ctx.translate(CX, CY - 8);
          ctx.scale(scale, scale);
          drawLeaf(-286, 0, 78, COLORS.lime, -0.22);
          ctx.fillStyle = COLORS.green;
          ctx.fillRect(-324, 37, 76, 8);
          ctx.font = "800 98px Inter, sans-serif";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillStyle = COLORS.black;
          ctx.fillText("개념의 숲", -180, -6);
          ctx.font = "600 22px Inter, sans-serif";
          ctx.fillStyle = COLORS.green;
          ctx.fillText("생각의 씨앗, 개념의 숲", -177, 82);
          ctx.restore();
        }

        function drawMorphingText(from, to, progress, y, size, scale = 1) {
          const p = clamp(progress);
          if (p < 0.5) {
            const xScale = scale * (1 - expoInOut(p * 2));
            withMotion(() => text(from, CX, y, size, COLORS.black, 900, xScale), -1100 * (1 - p * 2), 0);
          } else {
            const xScale = scale * expoOut((p - 0.5) * 2);
            withMotion(() => text(to, CX, y, size, COLORS.black, 900, xScale), 1100 * ((p - 0.5) * 2), 0);
          }
        }

        function drawHook(time) {
          if (time === 0) {
            drawLogo();
            return;
          }
          if (time < 0.78) {
            const p = expoInOut(time / 0.78);
            if (p < 0.5) drawLogo(1 - expoInOut(p * 2));
            else text("왜?", CX, CY - 26, 270, COLORS.black, 900, expoOut((p - 0.5) * 2));
          } else if (time < 1.12) {
            drawMorphingText("왜?", "질문", (time - 0.78) / 0.34, CY - 26, 248);
          } else {
            const p = spring((time - 1.12) / 0.46);
            withMotion(() => text("질문", CX, CY - 26, 248, COLORS.black, 900, 0.94 + p * 0.06), 480 * (1 - p), 0);
          }
          const lineStart = 0.7;
          const lineProgressAmount = expoOut((time - lineStart) / (2 - lineStart));
          lineProgress(CX - 380, 680, CX + 380, 680, lineProgressAmount, COLORS.green, 7);
        }

        function drawTypeBar(progress) {
          const p = clamp(progress);
          const words = ["질문", "생각", "연결", "이해"];
          if (p < 0.74) {
            const index = Math.min(2, Math.floor(p / 0.25));
            const local = (p - index * 0.25) / 0.25;
            drawMorphingText(words[index], words[index + 1], local, CY - 26, 248);
            const lineWidth = 760 + expoOut(p) * 120;
            line(CX - lineWidth / 2, 680, CX + lineWidth / 2, 680, COLORS.green, 7);
          } else {
            const q = expoInOut((p - 0.74) / 0.26);
            text("이해", CX, CY - 26, 248, COLORS.black, 900, 1 - q);
            const halfWidth = mix(440, 650, q);
            const y = mix(680, CY, q);
            const lineWidth = mix(7, 5, q);
            line(CX - halfWidth, y, CX, y, COLORS.green, lineWidth);
            line(CX, y, CX + halfWidth, y, COLORS.green, lineWidth);
            drawLeaf(CX, CY, 94 * q, COLORS.lime, -0.2 * (1 - q));
            [CX - 650, CX, CX + 650].forEach((x, index) => {
              drawMorphNode(x, CY, 4 * q, 0, index === 1 ? COLORS.green : COLORS.lime);
            });
          }
        }

        const mainPoints = [
          { x: -650, y: 0, label: "질문", color: COLORS.lime },
          { x: 0, y: 0, label: "개념", color: COLORS.green },
          { x: 650, y: 0, label: "적용", color: COLORS.orange }
        ];
        const graphPoints = [
          { x: -430, y: 24, label: "질문", color: COLORS.lime },
          { x: 0, y: -190, label: "개념", color: COLORS.green },
          { x: 430, y: 24, label: "적용", color: COLORS.orange }
        ];
        const mapPoints = [
          { x: -430, y: 24, label: "질문", color: COLORS.lime },
          { x: 0, y: -190, label: "개념", color: COLORS.green },
          { x: 430, y: 24, label: "적용", color: COLORS.orange },
          { x: -300, y: 210, label: "근거", color: COLORS.orange },
          { x: 300, y: 210, label: "설명", color: COLORS.lime }
        ];

        function drawMorphingNetwork(progress) {
          const p = clamp(progress);
          const nodes = mainPoints.map((point, index) => ({
            ...point,
            x: mix(point.x, graphPoints[index].x, expoOut(p)),
            y: mix(point.y, graphPoints[index].y, expoOut(p))
          }));
          const left = [CX + nodes[0].x, CY + nodes[0].y];
          const middle = [CX + nodes[1].x, CY + nodes[1].y];
          const right = [CX + nodes[2].x, CY + nodes[2].y];
          line(left[0], left[1], middle[0], middle[1], COLORS.green, 5);
          line(middle[0], middle[1], right[0], right[1], COLORS.green, 5);
          if (p < 0.38) drawLeaf(CX, CY, 94 * (1 - expoOut(p / 0.38)), COLORS.lime, -0.2 + p * 0.5);
          nodes.forEach((node, index) => {
            const radius = 4 + expoOut(p) * (index === 1 ? 24 : 20);
            const x = CX + node.x;
            const y = CY + node.y;
            drawMorphNode(x, y, radius, expoOut(p), node.color);
          });
        }

        function project(x, y, depth) {
          return [x + depth * 0.52, y - depth * 0.36];
        }

        function drawBlock(cx, cy, width, height, depth, front, label, labelScale = 1, shapeMorph = 1, labelOffsetY = 0) {
          if (depth < 1 && Math.abs(width - height) < 1) {
            drawMorphNode(cx, cy, width / 2, shapeMorph, front);
            if (labelScale > 0.08) text(label, cx, cy + labelOffsetY, 34 * labelScale, COLORS.black, 800, 1);
            return;
          }
          const halfW = width / 2;
          const halfH = height / 2;
          const a = [cx - halfW, cy - halfH];
          const b = [cx + halfW, cy - halfH];
          const c = [cx + halfW, cy + halfH];
          const d = [cx - halfW, cy + halfH];
          const ap = project(a[0], a[1], depth);
          const bp = project(b[0], b[1], depth);
          const cp = project(c[0], c[1], depth);
          polygon([a, b, bp, ap], COLORS.white, COLORS.black, 3);
          polygon([b, c, cp, bp], COLORS.green, COLORS.black, 3);
          polygon([a, b, c, d], front, COLORS.black, 3);
          if (labelScale > 0.08) text(label, cx, cy + labelOffsetY, 34 * labelScale, COLORS.black, 800, 1);
        }

        function drawCards(progress) {
          const p = clamp(progress);
          if (p === 0) {
            drawMorphingNetwork(1);
            return;
          }
          const grown = expoOut(Math.min(1, p * 2));
          const cardPhase = expoOut(Math.max(0, (p - 0.5) * 2));
          const xs = [-438, 0, 438];
          const labels = ["질문", "연결", "적용"];
          const colors = [COLORS.lime, COLORS.green, COLORS.orange];
          const boxW = p < 0.5 ? 48 + grown * 217 : mix(265, 402, cardPhase);
          const boxH = p < 0.5 ? 48 + grown * 232 : mix(280, 430, cardPhase);
          const depth = p < 0.5 ? grown * 136 : mix(136, 0, cardPhase);
          const centers = xs.map((x, i) => {
            const start = graphPoints[i];
            const amount = expoOut(Math.min(1, p * 2));
            return [
              mix(CX + start.x, CX + x, amount),
              mix(CY + start.y, CY + (i === 1 ? -30 : 10), amount)
            ];
          });
          line(centers[0][0], centers[0][1], centers[1][0], centers[1][1], COLORS.green, 5);
          line(centers[1][0], centers[1][1], centers[2][0], centers[2][1], COLORS.green, 5);
          centers.forEach(([x, y], i) => {
            const nodeColor = colors[i];
            const front = p < 0.5 ? nodeColor : COLORS.lime;
            const shapeMorph = expoOut(Math.min(1, p * 2));
            const titleMotion = p < 0.5 ? 0 : cardPhase;
            const labelScale = p < 0.5 ? grown : 1 - cardPhase * 0.3;
            const labelOffset = titleMotion * (-boxH / 2 + 52);
            drawBlock(x, y, boxW, boxH, depth, front, labels[i], labelScale, shapeMorph, labelOffset);
            if (p > 0.5) {
              const ui = cardPhase;
              const reveal = expoOut((ui - 0.35) / 0.65);
              ctx.save();
              ctx.beginPath();
              ctx.rect(x - boxW / 2 + 3, y - boxH / 2 + 3, boxW - 6, boxH - 6);
              ctx.clip();
              line(x - boxW / 2 + 34, y - boxH / 2 + 84, x - boxW / 2 + 110 + 72 * reveal, y - boxH / 2 + 84, COLORS.green, 4);
              if (reveal > 0.01) {
                text(["무엇이 궁금할까?", "어떻게 연결될까?", "어디에 적용할까?"][i], x, y - 28, 25 + reveal * 9, COLORS.black, 800, 1);
                text(["핵심 질문", "개념 지도", "새로운 사례"][i], x, y + 44, 18 + reveal * 3, COLORS.black, 500, 1);
              }
              const barY = y + boxH / 2 - 46;
              line(x - boxW / 2 + 34, barY, x + boxW / 2 - 34, barY, COLORS.white, 12);
              line(x - boxW / 2 + 34, barY, mix(x - boxW / 2 + 34, x + boxW / 2 - 34, 0.38 + i * 0.2 * ui), barY, i === 1 ? COLORS.green : COLORS.orange, 12);
              ctx.restore();
            }
          });
        }

        const mapEdges = [[0, 1], [1, 2], [0, 3], [1, 3], [1, 4], [2, 4]];

        function drawMap(progress) {
          const p = clamp(progress);
          if (p === 0) {
            drawCards(1);
            return;
          }
          const reveal = expoOut((p - 0.62) / 0.38);
          mapEdges.filter(([a, b]) => a >= 3 || b >= 3).forEach(([a, b]) => {
            const start = mapPoints[a >= 3 ? b : a];
            const end = mapPoints[a >= 3 ? a : b];
            lineProgress(CX + start.x, CY + start.y, CX + end.x, CY + end.y, reveal, COLORS.green, 4);
          });
          drawCards(1 - p);
          [3, 4].forEach((index) => {
            const node = mapPoints[index];
            const radius = 30 * reveal;
            if (radius < 1) return;
            drawMorphNode(CX + node.x, CY + node.y, radius, 1, node.color);
            if (radius > 14) text(node.label, CX + node.x, CY + node.y + 52, 19, COLORS.black, 700);
          });
        }

        function drawTreeBase(x, baseY, topY, width, label, depth = 46) {
          const shift = project(0, 0, depth);
          const dx = shift[0];
          const dy = shift[1];
          polygon([[x - width / 2, baseY], [x + width / 2, baseY], [x + width / 2 + dx, baseY + dy], [x - width / 2 + dx, baseY + dy]], COLORS.green, COLORS.black, 3);
          polygon([[x - width / 2, baseY], [x + width / 2, baseY], [x + width * 0.16, topY], [x - width * 0.16, topY]], COLORS.lime, COLORS.black, 3);
          polygon([[x + width / 2, baseY], [x + width / 2 + dx, baseY + dy], [x + width * 0.16 + dx, topY + dy], [x + width * 0.16, topY]], COLORS.green, COLORS.black, 3);
          line(x, baseY - 5, x, topY + 10, COLORS.black, 3);
          drawLeaf(x - width * 0.42, topY + 8, width * 0.7, COLORS.lime, -0.62);
          drawLeaf(x + width * 0.4, topY + 6, width * 0.66, COLORS.green, 0.62);
          drawLeaf(x, topY - 22, width * 0.86, COLORS.lime, 0);
          text(label, x, baseY + 42, 19, COLORS.black, 700);
          return [x, topY - 22];
        }

        function drawForest(progress, scale = 1, title = true) {
          const p = clamp(progress);
          if (p === 0 && scale === 1 && title) {
            drawMap(1);
            return;
          }
          const floor = CY + 245;
          const xs = [-430, 0, 430, -300, 300];
          const labels = mapPoints.map((point) => point.label);
          const heights = [220, 410, 250, 160, 170];
          const eased = expoOut(p);
          mapEdges.forEach(([a, b]) => {
            const from = mapPoints[a];
            const to = mapPoints[b];
            const ya = mix(from.y, 245 - heights[a], eased);
            const yb = mix(to.y, 245 - heights[b], eased);
            line(CX + mix(from.x, xs[a], eased), CY + ya, CX + mix(to.x, xs[b], eased), CY + yb, COLORS.green, 4);
          });
          for (let i = 0; i < xs.length; i += 1) {
            const x = mix(mapPoints[i].x, xs[i], eased);
            const topY = mix(CY + mapPoints[i].y, floor - heights[i], eased);
            const width = (i === 2 ? 98 : 72) * scale * eased;
            if (p > 0.04) drawTreeBase(CX + x * scale, CY + 245 * scale, mix(CY + mapPoints[i].y, topY, scale), width, labels[i], 42 * scale);
          }
          if (p > 0.35 && title) {
            const reveal = spring((p - 0.35) / 0.42);
            ctx.save();
            ctx.translate(CX, CY + 402);
            ctx.scale(scale, 1);
            text("생각이 연결될수록", 0, -74, 34 * reveal, COLORS.green, 700);
            text("개념은 자란다", 0, 4, 98 * reveal, COLORS.black, 900);
            ctx.restore();
          }
        }

        function drawClimax(progress, collapse = 0) {
          const p = clamp(progress);
          const scale = 1 - expoInOut(collapse);
          if (collapse === 0) {
            drawForest(p, 1, true);
            return;
          }
          ctx.save();
          ctx.translate(CX * (1 - scale), CY * (1 - scale));
          ctx.scale(scale, scale);
          drawForest(p, 1, true);
          ctx.restore();
          drawLogo(spring(collapse / 0.82));
        }

        function drawFinal(time) {
          const progress = clamp((time - 14) / 0.5);
          if (time >= 14.5) {
            drawLogo();
            return;
          }
          drawClimax(1, progress);
        }

        function draw(t) {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.filter = "none";
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(0, 0, W, H);
          if (t === 0 || t >= 14.5) {
            drawLogo();
          } else if (t < 2) {
            drawHook(t);
          } else if (t < 4) {
            drawTypeBar((t - 2) / 2);
          } else if (t < 6) {
            drawMorphingNetwork((t - 4) / 2);
          } else if (t < 8) {
            drawCards((t - 6) / 4);
          } else if (t < 10) {
            drawCards(0.5 + (t - 8) / 4);
          } else if (t < 12) {
            drawMap((t - 10) / 2);
          } else if (t < 14) {
            drawClimax((t - 12) / 2);
          } else {
            drawFinal(t);
          }
        }

        window.seek = (time) => {
          const t = clamp(Number(time) || 0, 0, 15);
          draw(t);
          return t;
        };

        const audioNotes = [110, 130.81, 146.83, 98, 123.47, 164.81, 146.83, 110];
        const writeAscii = (view, offset, value) => {
          for (let i = 0; i < value.length; i += 1) view.setUint8(offset + i, value.charCodeAt(i));
        };

        window.downloadWav = async () => {
          const AudioContextClass = window.OfflineAudioContext || window.webkitOfflineAudioContext;
          if (!AudioContextClass) throw new Error("이 브라우저는 오프라인 오디오 렌더링을 지원하지 않습니다.");
          const sampleRate = 48000;
          const length = sampleRate * 15;
          const offline = new AudioContextClass(2, length, sampleRate);
          const master = offline.createGain();
          const compressor = offline.createDynamicsCompressor();
          compressor.threshold.value = -18;
          compressor.knee.value = 18;
          compressor.ratio.value = 3;
          compressor.attack.value = 0.004;
          compressor.release.value = 0.18;
          master.gain.value = 0.72;
          master.connect(compressor);
          compressor.connect(offline.destination);

          function kick(at, accent = 0.3) {
            const oscillator = offline.createOscillator();
            const envelope = offline.createGain();
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(138, at);
            oscillator.frequency.exponentialRampToValueAtTime(48, at + 0.14);
            envelope.gain.setValueAtTime(0.0001, at);
            envelope.gain.exponentialRampToValueAtTime(accent, at + 0.006);
            envelope.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);
            oscillator.connect(envelope);
            envelope.connect(master);
            oscillator.start(at);
            oscillator.stop(at + 0.22);
          }

          function click(at, accent = 0.09) {
            const oscillator = offline.createOscillator();
            const envelope = offline.createGain();
            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(820, at);
            oscillator.frequency.exponentialRampToValueAtTime(190, at + 0.055);
            envelope.gain.setValueAtTime(0.0001, at);
            envelope.gain.exponentialRampToValueAtTime(accent, at + 0.003);
            envelope.gain.exponentialRampToValueAtTime(0.0001, at + 0.075);
            oscillator.connect(envelope);
            envelope.connect(master);
            oscillator.start(at);
            oscillator.stop(at + 0.08);
          }

          function note(at, frequency, duration = 0.34) {
            const oscillator = offline.createOscillator();
            const envelope = offline.createGain();
            oscillator.type = "triangle";
            oscillator.frequency.value = frequency;
            envelope.gain.setValueAtTime(0.0001, at);
            envelope.gain.exponentialRampToValueAtTime(0.055, at + 0.025);
            envelope.gain.exponentialRampToValueAtTime(0.0001, at + duration);
            oscillator.connect(envelope);
            envelope.connect(master);
            oscillator.start(at);
            oscillator.stop(at + duration + 0.01);
          }

          for (let beat = 0; beat < 30; beat += 1) {
            const at = beat * 0.5;
            kick(at, beat % 4 === 0 ? 0.34 : 0.25);
            click(at + 0.02, beat % 4 === 0 ? 0.11 : 0.065);
            if (beat % 2 === 1) note(at + 0.06, audioNotes[Math.floor(beat / 2) % audioNotes.length]);
          }
          for (let bar = 0; bar < 8; bar += 1) {
            const at = bar * 2;
            click(at + 0.045, bar === 6 ? 0.2 : 0.13);
            note(at + 0.08, audioNotes[bar], 0.72);
          }

          const riserStart = 11.08;
          const riserLength = 0.92;
          const noiseBuffer = offline.createBuffer(1, Math.ceil(sampleRate * riserLength), sampleRate);
          const noiseData = noiseBuffer.getChannelData(0);
          let seed = 2317;
          for (let i = 0; i < noiseData.length; i += 1) {
            seed = (seed * 16807) % 2147483647;
            noiseData[i] = (seed / 1073741823.5) - 1;
          }
          const noise = offline.createBufferSource();
          const highpass = offline.createBiquadFilter();
          const riserGain = offline.createGain();
          noise.buffer = noiseBuffer;
          highpass.type = "highpass";
          highpass.frequency.setValueAtTime(250, riserStart);
          highpass.frequency.exponentialRampToValueAtTime(2600, 12);
          riserGain.gain.setValueAtTime(0.0001, riserStart);
          riserGain.gain.exponentialRampToValueAtTime(0.055, 12);
          riserGain.gain.exponentialRampToValueAtTime(0.0001, 12.12);
          noise.connect(highpass);
          highpass.connect(riserGain);
          riserGain.connect(master);
          noise.start(riserStart);
          noise.stop(12.13);

          const sweep = offline.createOscillator();
          const sweepGain = offline.createGain();
          sweep.type = "sine";
          sweep.frequency.setValueAtTime(180, riserStart);
          sweep.frequency.exponentialRampToValueAtTime(660, 12);
          sweepGain.gain.setValueAtTime(0.0001, riserStart);
          sweepGain.gain.exponentialRampToValueAtTime(0.055, 12);
          sweepGain.gain.exponentialRampToValueAtTime(0.0001, 12.16);
          sweep.connect(sweepGain);
          sweepGain.connect(master);
          sweep.start(riserStart);
          sweep.stop(12.17);

          const rendered = await offline.startRendering();
          const channels = rendered.numberOfChannels;
          const dataBytes = rendered.length * channels * 2;
          const wav = new ArrayBuffer(44 + dataBytes);
          const view = new DataView(wav);
          writeAscii(view, 0, "RIFF");
          view.setUint32(4, 36 + dataBytes, true);
          writeAscii(view, 8, "WAVE");
          writeAscii(view, 12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, channels, true);
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * channels * 2, true);
          view.setUint16(32, channels * 2, true);
          view.setUint16(34, 16, true);
          writeAscii(view, 36, "data");
          view.setUint32(40, dataBytes, true);
          let offset = 44;
          for (let i = 0; i < rendered.length; i += 1) {
            for (let channel = 0; channel < channels; channel += 1) {
              const sample = clamp(rendered.getChannelData(channel)[i], -1, 1);
              view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
              offset += 2;
            }
          }
          const blob = new Blob([wav], { type: "audio/wav" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "concept-grove-intro.wav";
          link.click();
        };

        window.seek(0);
        document.fonts.ready.then(() => window.seek(0));
      })();
    </script>
  </body>
</html>
