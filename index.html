<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <title>개념의 숲 | 교과 개념 학습</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-view="home" aria-label="개념의 숲 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M16 27V15m0 7c-5.8 0-9-3-9-8.5C12.5 13.5 16 16.7 16 22Zm0-4c0-6.2 3.2-10.1 9-11-0.1 5.7-3 9.2-9 11Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 27h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-copy"><strong>개념의 숲</strong><small>CONCEPT GROVE</small></span>
        </a>

        <div class="sidebar-label">학습 공간</div>
        <nav class="main-nav" aria-label="주 메뉴">
          <button class="nav-link active" data-view="home"><span class="nav-icon">⌂</span>오늘의 학습</button>
          <button class="nav-link" data-view="library"><span class="nav-icon">▤</span>내 개념 노트</button>
          <button class="nav-link" data-view="records"><span class="nav-icon">◷</span>학습 기록</button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">이번 주 목표</div>
        <div class="goal-card">
          <div class="goal-icon">✳</div>
          <strong>천천히, 깊게</strong>
          <p>개념 하나를 내 말로 설명해 봐요.</p>
          <div class="goal-progress"><span id="weekly-progress"></span></div>
          <small id="weekly-label">이번 주 0개 개념 완료</small>
        </div>

        <div class="sidebar-bottom">
          <span class="avatar">나</span>
          <span class="profile-copy"><strong>나의 학습 공간</strong><small>나만의 속도로 성장 중</small></span>
          <span class="profile-menu" aria-hidden="true">···</span>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>나의 학습</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb-current">오늘의 학습</strong></div>
          <div class="topbar-right">
            <div class="streak-chip"><span>♨</span><strong id="streak-count">0</strong><span>일 연속</span></div>
            <div class="xp-chip"><span class="xp-star">✦</span><strong id="xp-count">0</strong><span>XP</span></div>
          </div>
        </header>
        <section id="app-content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script src="app.js"></script>
  </body>
</html>
